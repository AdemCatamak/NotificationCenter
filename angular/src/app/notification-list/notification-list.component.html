<div style="margin-top: 10px;"></div>

<div *ngIf="notifications.length > 0">
  <div style="margin-top: 5px; margin-bottom: 5px;" [style.background-color]="notification.isSeen ? 'transparent' : '#EEDFDE'"
    *ngFor="let notification of notifications">
    <span>{{notification.title}}</span> - <span style="color: gray;">{{notification.content}}</span>
  </div>
</div>

<div *ngIf="notifications.length == 0">There is no notification</div>
